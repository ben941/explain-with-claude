<!doctype html>
<!--
  options.html - the extension's settings page.
  Reached by right-clicking the extension icon and choosing "Options".
  It is a single form: one input for the Claude API key and a Save button.
  options.js (loaded at the bottom) handles saving the key to Chrome storage
  and reading it back, so background.js can use it without the key being in code.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Explain this with Claude – Options</title>
  <style>
    body { font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 32px; background: #fafafa; color: #222; }
    main { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #e3e3e3; border-radius: 12px; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #666; font-size: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 14px; padding: 10px 18px; font-size: 14px; border: 0; border-radius: 8px; background: #6b4fd8; color: #fff; cursor: pointer; }
    button:hover { background: #5a40c2; }
    #status { margin-left: 12px; font-size: 14px; color: #2e7d32; }
    a { color: #6b4fd8; }
  </style>
</head>
<body>
  <main>
    <h1>Explain this with Claude</h1>
    <p>Paste your Claude API key. It is stored in Chrome's extension storage and only sent to api.anthropic.com.
       Get a key at <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <button id="save">Save</button><span id="status"></span>
  </main>
  <script src="options.js"></script>
</body>
</html>
